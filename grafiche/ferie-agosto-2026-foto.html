<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Innova Immobiliare — Chiusura estiva 8/8 – 23/8 2026 (versione foto)</title>
<link rel="stylesheet" href="poppins-embed.css">
<style>
:root{
  --amber:#E8982A;
  --amber-deep:#C97E15;
  --charcoal:#4A4A4A;
  --charcoal-deep:#2B2A28;
  --cream:#FBF6EE;
  --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#141312;color:var(--cream);
  display:flex;flex-wrap:wrap;gap:48px;justify-content:center;align-items:flex-start;padding:48px}
.shell{display:flex;flex-direction:column;gap:14px;align-items:center}
.shell .caption{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#8C8579;font-weight:600}

/* ---------- POSTER ---------- */
.poster{
  --s:1;                                   /* scala tipografica */
  --scrim-start:38%;                       /* dove inizia la velatura scura */
  position:relative;overflow:hidden;background:var(--charcoal-deep);flex:none;
}
.poster.post {--s:.95;--scrim-start:34%; width:1080px;height:1350px}
.poster.story{--s:1.2;--scrim-start:40%; width:1080px;height:1920px}

/* foto a tutto campo */
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* riscaldamento sulla palette Innova */
.warm{position:absolute;inset:0;background:#E8982A;mix-blend-mode:soft-light;opacity:.22;pointer-events:none}
.post .warm{opacity:.14}
/* velatura per la leggibilità del testo */
.scrim{position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(43,42,40,.72) 0%, rgba(43,42,40,.12) 18%, rgba(43,42,40,0) 30%),
    linear-gradient(to bottom, rgba(43,42,40,0) var(--scrim-start), rgba(43,42,40,.78) 62%, rgba(43,42,40,.95) 82%, #2B2A28 100%)}
/* alone ambra come nella hero del sito */
.glow{position:absolute;right:-200px;bottom:120px;width:640px;height:640px;border-radius:50%;
  background:radial-gradient(circle, rgba(232,152,42,.18), transparent 65%);pointer-events:none}

.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(60px * var(--s)) calc(72px * var(--s)) calc(58px * var(--s))}

/* marchio */
.brand{font-size:calc(25px * var(--s));font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--cream);text-shadow:0 2px 24px rgba(0,0,0,.6)}
.brand span{color:var(--amber)}
.brand small{display:block;margin-top:calc(9px * var(--s));font-size:calc(13px * var(--s));
  font-weight:400;letter-spacing:.32em;color:#EFE6D6;opacity:.9}

.block{display:flex;flex-direction:column;align-items:flex-start}

.eyebrow{display:inline-block;border:1px solid var(--amber);color:var(--amber);
  font-size:calc(15px * var(--s));letter-spacing:.22em;text-transform:uppercase;font-weight:600;
  padding:calc(9px * var(--s)) calc(22px * var(--s));border-radius:999px;margin-bottom:calc(24px * var(--s));
  background:rgba(43,42,40,.35)}

h1{font-size:calc(70px * var(--s));font-weight:700;line-height:1.1;letter-spacing:-.01em;
  text-shadow:0 4px 30px rgba(0,0,0,.45)}
h1 em{font-style:normal;color:var(--amber)}

.dates{margin-top:calc(28px * var(--s));display:inline-flex;flex-direction:column;gap:calc(6px * var(--s));
  background:rgba(43,42,40,.55);border:1px dashed rgba(232,152,42,.6);border-radius:calc(18px * var(--s));
  padding:calc(22px * var(--s)) calc(40px * var(--s)) calc(24px * var(--s));backdrop-filter:blur(2px)}
.dates .label{font-size:calc(15px * var(--s));letter-spacing:.2em;text-transform:uppercase;color:#C9C1B4;font-weight:500}
.dates .value{font-size:calc(60px * var(--s));font-weight:800;color:var(--amber);letter-spacing:.01em;line-height:1.15}
.dates .value i{font-style:normal;font-weight:400;opacity:.7;margin:0 calc(4px * var(--s))}
.dates .note{margin-top:calc(4px * var(--s));font-size:calc(21px * var(--s));font-weight:300;color:#E4D9C6}
.dates .note b{font-weight:600;color:var(--white)}

.sub{margin-top:calc(26px * var(--s));font-size:calc(21px * var(--s));font-weight:300;line-height:1.5;
  color:#E4D9C6;max-width:calc(760px * var(--s));text-shadow:0 2px 16px rgba(0,0,0,.5)}

.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:calc(30px * var(--s));
  border-top:1px solid rgba(251,246,238,.2);padding-top:calc(22px * var(--s));margin-top:calc(34px * var(--s));width:100%}
.payoff{color:var(--amber);font-size:calc(21px * var(--s));font-weight:500;letter-spacing:.04em}
.contacts{text-align:right;font-size:calc(16px * var(--s));font-weight:300;color:#CFC7B9;line-height:1.7}
.contacts b{display:block;font-weight:500;color:var(--cream)}
</style>
</head>
<body>

<!-- =================================================================
  Grafica "Chiusura estiva" — Innova Immobiliare, versione fotografica.
  Post  : tramonto sul mare di Palermo (foto/mondello-tramonto.jpg)
  Story : la costa vista dall'aereo   (foto/costa-dallaereo.jpg)
  Sopra la foto: velatura charcoal per la leggibilità, riscaldamento
  ambra in soft-light e gli stessi stilemi della landing (eyebrow,
  box date tratteggiato, payoff).
================================================================== -->

<div class="shell">
  <div class="poster post" id="post"></div>
  <div class="caption">Post 1080 × 1350</div>
</div>

<div class="shell">
  <div class="poster story" id="story"></div>
  <div class="caption">Story 1080 × 1920</div>
</div>

<script>
const CONTENT = `
  <div class="warm"></div>
  <div class="scrim"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="brand">Innova <span>Immobiliare</span>
      <small>Palermo</small>
    </div>

    <div class="block">
      <span class="eyebrow">Avviso ai clienti</span>
      <h1>Chiusi per <em>ferie</em>.</h1>

      <div class="dates">
        <span class="label">Periodo di chiusura</span>
        <span class="value">8 <i>—</i> 23 agosto</span>
        <span class="note">Riapriamo <b>lunedì 24 agosto 2026</b></span>
      </div>

      <p class="sub">Scrivici pure in questi giorni: leggeremo ogni richiesta e ti
      risponderemo appena rientrati in ufficio. Buona estate!</p>

      <div class="foot">
        <span class="payoff">Progetta il tuo futuro.</span>
        <span class="contacts">
          <b>info@innovaimmobiliare.it</b>
          innovaimmobiliare.it
        </span>
      </div>
    </div>
  </div>`;

/* pos = inquadratura (object-position), tr = zoom/spostamento fine sulla foto */
const PHOTOS = {
  post:  {src:'foto/mondello-tramonto.jpg', pos:'50% 22%', tr:'none',
          alt:'Luna piena sul mare di Palermo'},
  story: {src:'foto/costa-dallaereo.jpg',   pos:'45% 50%', tr:'scale(1.3) translate(-2%, -7%)',
          alt:'La costa palermitana vista dall’aereo'},
};

for (const [id, p] of Object.entries(PHOTOS)) {
  document.getElementById(id).innerHTML =
    `<img class="photo" src="${p.src}" alt="${p.alt}"
          style="object-position:${p.pos};transform:${p.tr}">` + CONTENT;
}
</script>

</body>
</html>
